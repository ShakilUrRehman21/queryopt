[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryopt-lab"
version = "0.2.0"
description = "An experimental platform for studying and evaluating relational query optimization strategies"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "QueryOpt Lab Contributors" }
]
keywords = ["database", "query-optimization", "research", "benchmarking"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "sqlglot[c]>=25.0.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "click>=8.1.7",
    "rich>=13.9.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "duckdb>=1.1.0",      # semantic-equivalence tests
    "pymysql>=1.1.0",     # optional real-MySQL verification / benchmark
    "playwright>=1.45",   # optional browser tests (QUERYOPT_E2E=1)
]
analysis = [
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "jupyter>=1.1.0",
]
all = [
    "queryopt-lab[api,dev,analysis]",
]

[project.scripts]
queryopt = "queryopt.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-dir]
"" = "packages"

[tool.vercel]
entrypoint = "apps.api.main:app"

# ── Ruff (linting + formatting) ──────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "apps", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "ANN401",  # Dynamically typed expressions (Any)
]

[tool.ruff.lint.isort]
known-first-party = [
    "queryopt", "common", "storage", "parser", "planner",
    "executor", "optimizer", "query_stats", "benchmark", "experiment", "ai", "sqlopt"
]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "packages"

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages"]
asyncio_mode = "auto"
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (may use disk)",
    "property: Property-based tests (Hypothesis)",
    "regression: Regression tests for specific bugs",
    "slow: Tests that take > 5 seconds",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
